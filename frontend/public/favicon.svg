<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- Graduation Cap -->
  <g transform="translate(50, 50)">
    <!-- Cap base -->
    <ellipse cx="0" cy="5" rx="35" ry="8" fill="#ffffff" opacity="0.9"/>
    <!-- Cap top -->
    <path d="M -30 -15 L 0 -35 L 30 -15 L 30 5 L -30 5 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Tassel -->
    <line x1="30" y1="-15" x2="35" y2="-20" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="-20" r="2" fill="#ffd700"/>
  </g>
</svg>